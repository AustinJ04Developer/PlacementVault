<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pv-vault-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="pv-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="pv-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="pv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#pv-vault-bg)" filter="url(#pv-glow)" />

  <!-- Outer Vault Circle with Dial Markers -->
  <circle cx="32" cy="33" r="18" stroke="#93C5FD" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
  <circle cx="32" cy="33" r="21" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Graduation Cap (Mortarboard Top) representing Campus Placement -->
  <polygon points="32,15 48,22 32,29 16,22" fill="url(#pv-silver)" />
  <!-- Cap Underbody -->
  <path d="M22 25.5 V30 C22 33 26.5 35.5 32 35.5 C37.5 35.5 42 33 42 30 V25.5" fill="none" stroke="url(#pv-silver)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Tassel with golden pearl -->
  <path d="M44 23.5 L46 29.5 L47 34" stroke="url(#pv-gold)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="47" cy="34.5" r="1.5" fill="url(#pv-gold)" />

  <!-- Vault Safe Core & Keyhole representing Vault Knowledge Archive -->
  <rect x="25" y="36" width="14" height="15" rx="4" fill="#0F172A" stroke="url(#pv-gold)" stroke-width="2" />
  
  <!-- Keyhole in Vault -->
  <circle cx="32" cy="41.5" r="2.2" fill="url(#pv-gold)" />
  <polygon points="31,41.5 33,41.5 33.5,46.5 30.5,46.5" fill="url(#pv-gold)" />

  <!-- Corner Accent Bolts -->
  <circle cx="11" cy="11" r="1.8" fill="#FFFFFF" fill-opacity="0.4" />
  <circle cx="53" cy="11" r="1.8" fill="#FFFFFF" fill-opacity="0.4" />
  <circle cx="11" cy="53" r="1.8" fill="#FFFFFF" fill-opacity="0.4" />
  <circle cx="53" cy="53" r="1.8" fill="#FFFFFF" fill-opacity="0.4" />
</svg>
